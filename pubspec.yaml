name: nvimos_poc
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  re_highlight: ^0.0.3
  git: ^2.5.0
  path: ^1.9.1
  # PDF pages in the preview: the stub by default (nothing native to build). `make pdf-on` writes
  # pubspec_overrides.yaml (not in git) that points this at packages/ops_pdf_on, with pdfrx and PDFium.
  ops_pdf:
    path: packages/ops_pdf_off

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
